<!--
Component: Friends' Passes Summary
Purpose: Compact Epic, Ikon, and Other friend counts with deep links to the
         existing Friends pass filters. Nested inside the Home summary card.
Used on: Home screen

Inputs:
  friend_pass_counts   dict with epic, ikon, and other integer counts
  friend_count         int — total confirmed friends
  other_pass_slugs_url comma-separated canonical non-Epic/non-Ikon pass slugs
-->

<section class="fp-card" aria-labelledby="fp-card-title">
    <h2 class="fp-card-title" id="fp-card-title">
        Friends' Passes ·
        <a class="fp-card-total-link"
           href="{{ url_for('friends') }}"
           aria-label="Show {{ friend_count or 0 }} {{ 'friend' if (friend_count or 0) == 1 else 'friends' }}">
            {{ friend_count or 0 }} {{ 'friend' if (friend_count or 0) == 1 else 'friends' }} →
        </a>
    </h2>
    <div class="fp-card-grid">
        <a class="fp-card-link" href="{{ url_for('friends') }}?pass=epic"
           aria-label="Show {{ friend_pass_counts.epic or 0 }} Epic pass friends">
            <span class="fp-card-count">{{ friend_pass_counts.epic or 0 }}</span>
            <span class="fp-card-label">Epic</span>
        </a>
        <a class="fp-card-link" href="{{ url_for('friends') }}?pass=ikon"
           aria-label="Show {{ friend_pass_counts.ikon or 0 }} Ikon pass friends">
            <span class="fp-card-count">{{ friend_pass_counts.ikon or 0 }}</span>
            <span class="fp-card-label">Ikon</span>
        </a>
        <a class="fp-card-link" href="{{ url_for('friends') }}?pass={{ other_pass_slugs_url | urlencode }}"
           aria-label="Show {{ friend_pass_counts.other or 0 }} friends with other passes">
            <span class="fp-card-count">{{ friend_pass_counts.other or 0 }}</span>
            <span class="fp-card-label">Other</span>
        </a>
    </div>
</section>
