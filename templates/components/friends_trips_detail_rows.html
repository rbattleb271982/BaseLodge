{% for row in rows %}
<a href="{{ url_for('friend_trip_details', trip_id=row.trip_id) }}"
   class="ft-grouped-row"
   data-trip-id="{{ row.trip_id }}">
    <span class="ft-grouped-row-date">{{ format_trip_dates(row.trip, start_date=row.attendance_start_date, end_date=row.attendance_end_date) }}</span>
    <span class="ft-grouped-row-status">{{ row.status | capitalize }}</span>
</a>
{% endfor %}
