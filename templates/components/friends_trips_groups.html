{% from "components/my_trips_ledger.html" import friends_row %}
{% for month in friends_trips_tab %}
<section class="ledger-month-group friends-month-section" data-month-key="{{ month.month_key }}">
  <div class="ledger-month">
    <span>{{ month.month_label|upper }}</span>
    <span class="ledger-month-count">{{ month.rows|length }} trip{% if month.rows|length != 1 %}s{% endif %}</span>
  </div>
  {% for row in month.rows %}{{ friends_row(row) }}{% endfor %}
</section>
{% endfor %}
