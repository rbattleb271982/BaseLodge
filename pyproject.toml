[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.3.0",
    "click",
    "firebase-admin",
    "flask-compress",
    "flask-limiter[redis]",
    "httpx[http2]",
    "requests>=2.32.0",
    "email-validator>=2.3.0",
    "flask>=3.1.2",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "openpyxl",
    "posthog",
    "psycopg2-binary>=2.9.11",
    "PyJWT",
    "segno",
    "sendgrid",
    "sqlalchemy",
    "werkzeug>=3.1.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
